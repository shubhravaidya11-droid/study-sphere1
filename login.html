<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <link rel="stylesheet" href="sphere.css">
  <link rel="stylesheet" href="login.css" />
</head>
<body>

<!--nav section-->
<nav class="navbar">
  <div class="nav-container">
    <div class="logo">study sphere</div>

    <!-- Desktop nav -->
    <ul class="nav-links" aria-label="Primary navigation">
      <li><a href="index.html">Home</a></li>
      <li><a href="work.html">How it works</a></li>
      <li><a href="tools.html">About Tools</a></li>
      <li><a href="registration.html">Register</a></li>
      <li><a href="login.html">login</a></li>
    </ul>

    <!-- Mobile hamburger -->
    <button
      class="nav-hamburger"
      type="button"
      aria-label="Open navigation menu"
      aria-controls="mobile-menu"
      aria-expanded="false"
    >
      <span aria-hidden="true" class="hamburger-lines"></span>
    </button>

    <!-- Mobile dropdown -->
    <div id="mobile-menu" class="mobile-menu" role="dialog" aria-modal="false">
      <ul class="mobile-links" aria-label="Mobile navigation links">
        <li><a href="index.html">Home</a></li>
        <li><a href="work.html">How it works</a></li>
        <li><a href="tools.html">About Tools</a></li>

        <li><a href="login.html">login</a></li>
      </ul>
    </div>
  </div>
</nav>

  <div class="login-container" style="margin-top: 80px;">

    <h2>Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required />
      </div>
      <button type="submit">Login</button>
    </form>
    <p id="message"></p>
  </div>
  <script src="nav-mobile.js" defer></script>
  <script src="login.js"></script>
<script src="cursor-mouse.js" defer></script>
</body>
</html>
