<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>

<link rel="stylesheet" href="sphere.css">

<style>
body {
  margin: 0;
  padding-top: 80px; /* fixed navbar offset */
  font-family: 'Segoe UI', sans-serif;
  background: #5b1f2a;
  color: #f5c6a5;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

a{
    text-decoration: none;
}

.form-container {
  background: #6e2a36;
  padding: 30px;
  border-radius: 12px;
  width: 320px;
  box-shadow: 0 0 15px rgba(0,0,0,0.3);
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: none;
  border-radius: 6px;
  outline: none;
}

button {
  width: 100%;
  padding: 10px;
  background: #f5c6a5;
  color: #5b1f2a;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #ffd8b5;
}

.error {
  color: #ffb3b3;
  font-size: 13px;
}
</style>
</head>

<body>

<!--nav section-->
<nav class="navbar">
  <div class="nav-container">
    <div class="logo">study sphere</div>
    <ul class="nav-links">
<li><a href="index.html">Home</a></li>
      <li><a href="work.html">How it works</a></li>
      <li><a href="tools.html">About Tools</a></li>
      <li><a href="registration.html">Register</a></li>
      <li><a href="login.html">login</a></li>
    </ul>
  </div>
</nav>

<div class="form-container">

  <h2>Register</h2>

  <form id="form">
    <input type="text" id="name" placeholder="Full Name" required>

    <input type="email" id="email" placeholder="Email ID" required>

    <input type="password" id="password" placeholder="Set Password" required>

    <select id="year" required>
      <option value="">Select Academic Year</option>
      <option>7th Grade</option>
      <option>8th Grade</option>
      <option>9th Grade</option>
      <option>10th Grade</option>
      <option>11th Grade</option>
      <option>12th Grade</option>
      <option>1st Year Undergraduate</option>
      <option>2nd Year Undergraduate</option>
      <option>3rd Year Undergraduate</option>
    </select>

    <input type="number" id="age" placeholder="Age" required>

    <div class="error" id="error"></div>

    <button type="submit">Register</button>
  </form>
</div>


<script>
const form = document.getElementById("form");

const error = document.getElementById("error");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const age = Number(document.getElementById("age").value);
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (age < 13 || age > 50) {
    error.textContent = "Age must be between 13 and 50.";
    return;
  }

  error.textContent = "";

  try {
    const resp = await fetch("http://localhost:3001/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await resp.json().catch(() => ({}));

    if (!resp.ok) {
      error.textContent = data.message || "Registration failed.";
      return;
    }

    alert("Registration Successful! You can now login.");
    window.location.href = "login.html";
  } catch (err) {
    error.textContent = "Server not reachable.";
    console.error(err);
  }
});
</script>
<script src="cursor-mouse.js"></script>
</body>
</html>
